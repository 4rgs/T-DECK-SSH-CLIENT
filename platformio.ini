[env:tdeck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.psram_type = qspi
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=41
  -DTFT_SCLK=40
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DSPI_FREQUENCY=27000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
lib_deps = 
  lovyan03/LovyanGFX @ ^1.1.16
  bblanchon/ArduinoJson @ ^7.0.4

; Arquitectura modular activa por defecto
; Versión legacy disponible en src/backup_legacy/
build_src_filter = 
  +<*>
  -<backup_legacy/>
  +<hardware/>
  +<wifi/>
  +<ssh/>
  +<persistence/>
  +<ui/>
  +<commands/>
  
; NOTE:
; - Board is set to esp32s3box as a close default for ESP32-S3 with integrated display.
;   If you have a specific PlatformIO board ID for LilyGO T-Deck, replace 'esp32s3box'.
; - LovyanGFX is used for the 320x240 LCD. Pin mapping may need adjustment in src/display/LgfxConfig.hpp
; - Keyboard uses I2C via Wire; adjust address/keymap in src/keyboard/Keyboard.h
